name: CI

# Un workflow, tres carriles: /api (NestJS), /web (React+Vite) y /agent (.NET 8).
#
# POR QUE NACIO CASI TODO COMENTADO
# --------------------------------
# Este archivo entra al repo en el commit inicial, ANTES de que exista una sola
# carpeta del monorepo: /api, /web y /agent los crea F1-001. Un job que corre
# `npm ci` sobre una carpeta que no existe falla, y un CI que nace rojo enseña a
# ignorar el CI. Esa es la única forma real de perderlo.
#
# Así que cada carril arrancó comentado con la tarea exacta que lo descomenta, y
# el gate se endurece por etapas. Descomentar un carril es parte del entregable
# de la tarea que lo habilita, no un "ya luego".
#
# F1-001 creó el monorepo y encendió los tres carriles con su gate mínimo (lint,
# typecheck y build). F1-011 encendió los del carril api (servicio postgres,
# migrate deploy y npm test), F1-040 el de web y F1-020 el `dotnet test` del
# agente (el backlog se lo asignaba a F1-021). Ya no queda ningún paso comentado.
#
# El job `guardia` sí corre desde el minuto cero. No es de adorno: es lo que hace
# que el CI exista, se vea en verde en cada PR y falle si alguien commitea un
# secreto o un centinela.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # GUARDIA - activo desde el commit inicial. No depende de ninguna carpeta.
  # ---------------------------------------------------------------------------
  guardia:
    name: Guardia del repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Los centinelas son señales entre dos procesos de la máquina de Ricardo.
      # Si uno llega a main, la siguiente sesión nocturna arranca con el
      # centinela puesto y muere en el primer minuto sin hacer nada.
      - name: Ningún centinela del orquestador en el repo
        run: |
          for f in TAREA_CERRADA.txt TAREA_SALTADA.txt COLA_VACIA.txt; do
            if [ -f "$f" ]; then
              echo "::error::$f está commiteado. Es un centinela local, va en .gitignore."
              exit 1
            fi
          done
          echo "Sin centinelas."

      # Este proyecto maneja cadenas de conexión al SQL Server del cliente, API
      # keys por sucursal y (en Fase 2) el CSD del SAT. Ninguno de esos archivos
      # tiene por qué estar versionado nunca.
      - name: Ningún secreto versionado
        run: |
          hits=$(git ls-files | grep -E '(^|/)\.env($|\.)|\.(pem|key|cer|pfx)$|(^|/)config\.json$' | grep -v '\.env\.example$' | grep -v '^infra/config\.example\.json$' || true)
          if [ -n "$hits" ]; then
            echo "::error::Archivos sensibles versionados:"
            echo "$hits"
            exit 1
          fi
          echo "Sin secretos versionados."

      # El hook sólo sirve si se instala con finales LF. Con CRLF el `#!/bin/sh`
      # llega con un \r pegado: el hook queda instalado, se ve bien y no guarda
      # nada. .gitattributes lo fija; esto comprueba que siga fijado.
      - name: El hook pre-push conserva finales LF
        run: |
          if [ ! -f scripts/git-hooks/pre-push ]; then
            echo "::error::Falta scripts/git-hooks/pre-push, que es la guardia de main."
            exit 1
          fi
          if grep -q $'\r' scripts/git-hooks/pre-push; then
            echo "::error::scripts/git-hooks/pre-push tiene CRLF. Revisa .gitattributes."
            exit 1
          fi
          sh -n scripts/git-hooks/pre-push
          echo "Hook con LF y sintaxis válida."

  # ---------------------------------------------------------------------------
  # CARRIL /api (NestJS + Prisma + Postgres)
  # ACTIVO desde F1-001, que creó el monorepo. Corre lint + typecheck (y desde
  # F1-010, prisma validate + generate). Desde F1-011 levanta un Postgres 16,
  # aplica las migraciones y corre `npm test` completo: los e2e de auth y de
  # scope multiempresa, y los del esquema, contra base real.
  # ---------------------------------------------------------------------------
  api:
    name: API (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    # F1-011: los e2e de auth y de scoping necesitan base real.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: monitor_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          # El lock vivo es el del workspace root (/api y /web son workspaces npm).
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      # Lint antes que los tests: falla en un segundo en vez de quemar la suite.
      - run: npm run lint
      # F1-010: el schema se valida, y el cliente se genera ANTES del typecheck
      # (el seed y los tests del esquema importan sus tipos). Ninguno de los dos
      # toca la base: la URL es de relleno, sólo tiene que existir.
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/sin_base
      - run: npx prisma generate
      - run: npm run typecheck
      # F1-011: base real para los tests. Los secretos JWT son de relleno,
      # sintéticos, y sólo firman tokens dentro de esta corrida (sin ellos, el
      # setup de jest pone otros de relleno igual; aquí quedan explícitos).
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/monitor_test
      - run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/monitor_test
          JWT_ACCESS_SECRET: ci-access-secreto-de-relleno-sintetico-0000000001
          JWT_REFRESH_SECRET: ci-refresh-secreto-de-relleno-sintetico-000000002

  # ---------------------------------------------------------------------------
  # CARRIL /web (React 18 + Vite + TS)
  # ACTIVO desde F1-001: corre lint + build (tsc). El paso `test` lo encendió
  # F1-040 (el backlog se lo asignaba a F1-041): la base de la SPA ya trae lógica
  # de seguridad que no puede quedar sin gate (refresh de sesión, open redirect
  # del login, guardas de ruta y roles).
  # ---------------------------------------------------------------------------
  web:
    name: Web (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - run: npm run lint
      # tsc + vite build: el gate mínimo de tipos del frontend.
      - run: npm run build
      # F1-092: el bundle entero (lazy incluido) no pasa de 400 kB en gzip.
      - run: npm run check:bundle
      # F1-040: vitest + jsdom, sin red (la API se simula sobre fetch).
      - run: npm test

  # ---------------------------------------------------------------------------
  # CARRIL /agent (.NET 8 Worker Service)
  # ACTIVO desde F1-001: corre restore + build. El paso `test` lo encendió F1-020
  # (el backlog se lo asignaba a F1-021): la config, la redacción de secretos y
  # el diagnóstico de `agente test` ya son lógica que no puede quedar sin gate.
  # Los tests no necesitan Windows, SQL Server ni red.
  # ---------------------------------------------------------------------------
  agent:
    name: Agente (.NET 8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore
      # El agente se publica single-file self-contained x64 para Windows, pero
      # compila en Linux de sobra para el gate del PR.
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --verbosity normal
